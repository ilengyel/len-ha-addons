<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Task Solver">
    <meta name="theme-color" content="#7f3018">
    <title>{% block title %}Task Solver{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{{ request.scope.get('root_path', '') }}/static/favicon.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ request.scope.get('root_path', '') }}/static/apple-touch-icon.png">
    <link rel="stylesheet" href="{{ request.scope.get('root_path', '') }}/static/css/app.css?v=icon-align-v1">
</head>
<body>
    <main class="shell">
        <header class="site-header">
            <a class="brand" href="{{ request.scope.get('root_path', '') or '/' }}">
                <span class="brand-mark">Household and beyond</span>
                <span class="brand-name">Task Solver</span>
            </a>

            <nav class="nav-links" aria-label="Primary">
                <a href="{{ request.scope.get('root_path', '') or '/' }}">Board</a>
                <a href="{{ request.scope.get('root_path', '') }}/reports">Reports</a>
                <a href="{{ request.scope.get('root_path', '') }}/debug/uploads">Debug uploads</a>
            </nav>
        </header>

        {% block content %}{% endblock %}

        <footer class="site-footer">
            <span>Designed for a wall-mounted, touch-first iPad workflow.</span>
        </footer>
    </main>
    <script src="{{ request.scope.get('root_path', '') }}/static/js/app.js?v=icon-align-v1"></script>
</body>
</html>
