<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Task Solver">
    <meta name="theme-color" content="#7f3018" data-theme-color>
    <title>{% block title %}Task Solver{% endblock %}</title>
    <script>
        (function () {
            var storedTheme = window.localStorage.getItem('task-solver-theme');
            if (storedTheme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        }());
    </script>
    <link rel="icon" type="image/svg+xml" href="{{ request.scope.get('root_path', '') }}/static/favicon.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ request.scope.get('root_path', '') }}/static/apple-touch-icon.png">
    <link rel="stylesheet" href="{{ request.scope.get('root_path', '') }}/static/css/app.css?v=dark-theme-v1">
</head>
<body>
    <main class="shell">
        <header class="site-header">
            <a class="brand" href="{{ request.scope.get('root_path', '') or '/' }}">
                <span class="brand-mark">Household and beyond</span>
                <span class="brand-name">Task Solver</span>
            </a>

            <nav class="nav-links" aria-label="Settings">
                <details class="editor-menu settings-menu">
                    <summary class="icon-button" aria-label="Settings">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <circle cx="12" cy="12" r="3"></circle>
                            <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21a2 2 0 0 1-4 0v-.09A1.7 1.7 0 0 0 8.6 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H3a2 2 0 0 1 0-4h.09A1.7 1.7 0 0 0 4.6 8.6a1.7 1.7 0 0 0-.34-1.88l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V3a2 2 0 0 1 4 0v.09A1.7 1.7 0 0 0 15.4 4.6a1.7 1.7 0 0 0 1.88-.34l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 .6 1 1.7 1.7 0 0 0 1.1.4H21a2 2 0 0 1 0 4h-.09A1.7 1.7 0 0 0 19.4 15z"></path>
                        </svg>
                        <span class="sr-only">Settings</span>
                    </summary>
                    <div class="editor-panel settings-panel">
                        <a class="settings-menu__item" href="{{ request.scope.get('root_path', '') }}/reports">Reports</a>
                        <a class="settings-menu__item" href="{{ request.scope.get('root_path', '') }}/debug/uploads">Debug uploads</a>
                        <button class="settings-menu__item settings-menu__button" type="button" data-theme-toggle aria-label="Use dark theme" aria-pressed="false" title="Use dark theme">
                            <svg class="theme-toggle__icon theme-toggle__icon--moon" viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M21 14.5A8.5 8.5 0 0 1 9.5 3a7 7 0 1 0 11.5 11.5z"></path>
                            </svg>
                            <svg class="theme-toggle__icon theme-toggle__icon--sun" viewBox="0 0 24 24" aria-hidden="true">
                                <circle cx="12" cy="12" r="4"></circle>
                                <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
                            </svg>
                            <span data-theme-toggle-label>Use dark theme</span>
                        </button>
                    </div>
                </details>
            </nav>
        </header>

        {% block content %}{% endblock %}

        <footer class="site-footer">
            <span>Designed for a wall-mounted, touch-first iPad workflow.</span>
        </footer>
    </main>
    <script src="{{ request.scope.get('root_path', '') }}/static/js/app.js?v=dark-theme-v1"></script>
</body>
</html>
