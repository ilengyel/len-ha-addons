name: Valetudo Proxy
version: "0.1.1"
slug: valetudo_proxy
description: Open your robot's Valetudo interface through Home Assistant ingress.
url: https://github.com/ilengyel/len-ha-addons/tree/master/valetudo_proxy
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_title: Valetudo
panel_icon: mdi:robot-vacuum
panel_admin: false
options:
  robot_host: robot.example.invalid
  robot_port: 80
schema:
  robot_host: match(^[a-zA-Z0-9]([a-zA-Z0-9.-]{0,251}[a-zA-Z0-9])?$)
  robot_port: port
arch:
  - aarch64
  - amd64
